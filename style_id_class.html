<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto html</title>

    <style>
        h1 {
            background: red;
        }

        p {
            background: greenyellow;
        }

        #heading-2 {
            background: blue;
        }

        .fundo-vermelho {
            background: yellow;
        }

        .bold {
            color: brown;
        }
    </style>
</head>

<body>
    <h1 id="heading-1" class="fundo-vermelho">
        Cabeçalho 1
    </h1>
    <h1 id="heading-2" class="fundo-vermelho">
        Cabeçalho 2
    </h1>
    <p> 
        <b class="bold">Parágrafo 1</b>
    </p>
</body>

</html>
