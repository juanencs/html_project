<!DOCTYPE html>
<html lang="pt-BR">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Projeto html</title>

   <style>
      body {
         font-family: sans-serif;
      }

      label {
         cursor: pointer;
         display: block;
      }
   </style>
</head>

<body>
   <form action="#" method="get" target="_blank" autocomplete="off">
      <p>Formulário de informações</p>

      <p>
         <label for="nome">Nome:</label>
         <input type="text" id="nome" name="nome" placeholder="Seu nome">
      </p>

      <p>
         <label>Você é desenvolvedor?</label>
         Sim
         <input type="radio" id="dev" name="dev" value="sim">
         Não
         <input type="radio" id="nao-dev" name="dev" value="nao">
      </p>

      <p>
         Gênero: <br>
         <label>
            <input type="radio" id="masculino" name="genero" value="masculino">
            Masculino
         </label>
         <label>
            <input type="radio" id="feminino" name="genero" value="feminino">
            Feminino
         </label>
         <label>
            <input type="radio" id="outro" name="genero" value="outro">
            Outro
         </label>
      </p>

      <p>
         <label for="nome">Data:</label>
         <input type="date" id="date" name="date">
      </p>

      <p>
         <label for="datetime">Data:</label>
         <input type="datetime-local" id="datetime" name="datetime">
      </p>

      <p>
         <label for="time">Hora:</label>
         <input type="time" id="time" name="time">
      </p>

      <p>
         <label for="cor">Cor preferida:</label>
         <input type="color" id="cor" name="cor" value="#0000FF">
      </p>

      <p>
         <label for="email">Seu e-mail:</label>
         <input type="email" id="email" name="email" placeholder="nome@gmail.com">
      </p>

      <p>
         <label for="file">Sua foto:</label>
         <input type="file" id="file" name="file" accept="image/*" multiple>
      </p>

      <p>
         <button type="reset">Reset</button>
         <button type="submit">Enviar</button>
      </p>
   </form>
</body>

</html>
